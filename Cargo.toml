[package]
name = "xmcli"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Player de música tracker (.mod, .s3m, .xm, .it) para o terminal, com interface ASCII animada"
repository = "https://github.com/nanovision80/xmcli"
license = "MIT"
readme = "README.md"
keywords = ["tracker", "module", "player", "tui", "chiptune"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
anyhow = "1.0.104"
bzip2-rs = "0.1.2"
clap = { version = "4.6.6", features = ["derive"] }
cpal = "0.18.2"
crossterm = { version = "0.29.0", default-features = false, features = ["events", "windows"] }
directories = "6.0.0"
flate2 = "1.1.10"
lzma-rs = "0.3.0"
openmpt = { version = "0.3.1", optional = true }
ringbuf = "0.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }

# Sinais de término (RF-516). A mesma versão que o crossterm puxa com a feature `events`, que
# a detecção de redimensionamento liga (RF-513).
[target."cfg(unix)".dependencies]
signal-hook = "0.3.17"

# Emulador de terminal para o harness de snapshot: confere os bytes do `Painter` contra uma
# implementação independente de VT100/xterm, e não contra o próprio código (tests/screen).
[dev-dependencies]
vt100 = "0.16.2"

# Pseudo-terminal para os testes de restauração: o CI não tem terminal (tests/terminal.rs).
[target."cfg(unix)".dev-dependencies]
rustix = { version = "1", features = ["pty", "termios"] }

[features]
default = ["engine-openmpt"]
# Motor de reprodução externo. Exige libopenmpt no sistema; a etapa 8 do roteiro traz o
# motor próprio e torna esta dependência opcional de verdade.
engine-openmpt = ["dep:openmpt"]

[build-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

[profile.release]
# O mixer e o palco são laços numéricos apertados: vale pagar link-time
# optimization e abrir mão do unwinding para o compilador vetorizar melhor.
lto = "thin"
codegen-units = 1
panic = "abort"

